# Version du fichier docker-compose
version: '3'

services:

  # Service PostgreSQL pour la base de données Airflow avec données persistantes
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
    - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Service Webserver Airflow exposé sur le port 8081, avec création d'utilisateur admin si nécessaire
  webserver:
    image: apache/airflow:2.9.1-python3.11
    restart: always
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: 'd3f1e10b624f4c14b8f1c01f52ad921f7c9f527e91a66fc7d9f7f4416f67b3d2'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./exports:/opt/airflow/exports
    ports:
      - "8081:8080"
    command: >
      bash -c "
         airflow db upgrade &&
         if ! airflow users list | grep -q admin; then
           airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email ibrazobe@gmail.com;
         fi &&
         airflow webserver
      "

  # Service Scheduler Airflow pour l'exécution planifiée des tâches
  scheduler:
    image: apache/airflow:2.9.1-python3.11
    restart: always
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: 'd3f1e10b624f4c14b8f1c01f52ad921f7c9f527e91a66fc7d9f7f4416f67b3d2'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./exports:/opt/airflow/exports
    command: >
      bash -c "
        airflow db upgrade &&
        airflow scheduler
      "

# Volume Docker persistant pour stocker les données PostgreSQL
volumes:
  postgres_data:
